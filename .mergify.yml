---
pull_request_rules:
  - name: automatic merge
    conditions:
      - and: &base_checks
          - base=main
          - -label~=^(acceptance-tests-needed|not-ready)$
          - '-check-failure~=^(?!(Rule:|Mergify|Summary))'
          - '-check-pending~=^(?!(Rule:|Mergify|Summary))'
          - check-success=backlogger_preview_build
          - check-success=test
          - linear-history
      - "#approved-reviews-by>=2"
      - "#changes-requested-reviews-by=0"
      # https://docs.mergify.com/configuration/conditions/#require-all-requested-reviews-to-be-approved
      - "#review-requested=0"
    actions: &merge
      merge:
        method: fast-forward
  - name: automatic merge on special label
    conditions:
      - and: *base_checks
      - label=merge-fast
    actions: *merge
  - name: automatic merge for dependabot updates
    conditions:
      - and: *base_checks
      - author=dependabot[bot]
      - "#commits-behind=0"
    actions: *merge
  # dependabot only rebases on conflicts, not when merely behind main
  - name: rebase green dependabot updates behind main
    conditions:
      - and: *base_checks
      - author=dependabot[bot]
      - "#commits-behind>0"
    actions: &rebase
      rebase:
        bot_account: suse-qe-tools-mergify
  - name: continuously rebase pull requests when labeled with `rebase`
    conditions:
      - base=main
      - label=rebase
    actions: *rebase
