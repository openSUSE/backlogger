---
pull_request_rules:
  - name: automatic merge
    conditions:
      - and: &base_checks
          - base=main
          - -label~=^(acceptance-tests-needed|not-ready)$
          - '-check-failure~=^(?!(Rule:|Mergify|Summary))'
          - '-check-pending~=^(?!(Rule:|Mergify|Summary))'
          - check-success=backlogger_preview_build
          - check-success=test
          - linear-history
      - "#approved-reviews-by>=2"
      - "#changes-requested-reviews-by=0"
    actions: &merge
      merge:
        method: fast-forward
  - name: automatic merge on special label
    conditions:
      - and: *base_checks
      - label=merge-fast
    actions: *merge
  - name: automatic merge for dependabot updates that only bump dependencies
    conditions:
      - and: *base_checks
      - and: &bot_gate
          - author=dependabot[bot]
          - "#changes-requested-reviews-by=0"
      - "#commits-behind=0"
      # A commit pushed on top of the bot's own is a code change, not a bump
      - "#commits=1"
      # A bump only writes these paths; anything else needs review
      - -files~=^(?!(\.github/workflows/[^/]+\.ya?ml)$).+
    actions: &bump_merge
      merge:
        method: fast-forward
  - name: require review for other dependabot updates
    conditions:
      - and: *base_checks
      - and: *bot_gate
      - "#commits-behind=0"
      - "#approved-reviews-by>=1"
    actions: *bump_merge
  # dependabot only rebases on conflicts, not when merely behind main
  - name: rebase green dependabot updates behind main
    conditions:
      - and: *base_checks
      - author=dependabot[bot]
      - "#commits-behind>0"
    actions: &rebase
      rebase:
        bot_account: suse-qe-tools-mergify
  - name: continuously rebase pull requests when labeled with `rebase`
    conditions:
      - base=main
      - label=rebase
    actions: *rebase
