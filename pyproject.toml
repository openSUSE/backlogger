[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "backlogger"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Markdown",
    "pyyaml",
    "requests",
    "urllib3",
    "weasyprint",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
py-modules = ["backlogger", "entrypoint"]
